<style>
:root{
  --hunt:#2F4734;--ox:#6B2227;--gold:#B08D2B;--parch:#F4EEE1;
  --ink:#1E1E1E;--line:#d8cdb6;--card:#fbf7ee;--muted:#6f6a5c;
  --alt:#f3ede0;--blue:#3d6a7a;--clay:#a8632f;--sage:#6b8e6f;
  --r:10px;--shadow:0 2px 8px rgba(0,0,0,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--parch);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:15px;line-height:1.45;padding-bottom:72px}
h1,h2,h3,.serif{font-family:Georgia,serif}

/* ── TOP BAR ── */
.topbar{background:var(--hunt);padding:14px 16px 10px;position:sticky;top:0;z-index:50}
.topbar-row{display:flex;align-items:baseline;justify-content:space-between}
.topbar b{font-family:Georgia;font-size:17px;color:#fff;letter-spacing:-.2px}
.topbar span{font-size:11px;color:#adc4ad}
.section-title{font-family:Georgia;font-size:20px;font-weight:700;
  color:var(--hunt);margin:0 0 2px;padding-top:2px}

/* ── BOTTOM NAV ── */
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:50;
  background:var(--hunt);display:flex;overflow-x:auto;
  scrollbar-width:none;border-top:2px solid rgba(255,255,255,.12)}
.bnav::-webkit-scrollbar{display:none}
.bnav-item{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;
  padding:8px 14px 10px;cursor:pointer;opacity:.55;transition:opacity .15s;
  border:none;background:transparent;color:#fff;font:inherit;font-size:10px;gap:3px}
.bnav-item .ico{font-size:18px;line-height:1}
.bnav-item.on{opacity:1;border-top:2px solid var(--gold);margin-top:-2px}

/* ── LAYOUT ── */
.page{display:none;padding:16px 14px 20px}
.page.on{display:block}
.lede{color:var(--muted);font-size:13px;margin:4px 0 14px;line-height:1.5}

/* ── CARDS ── */
.card{background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:14px;margin-bottom:12px;
  box-shadow:var(--shadow)}
.card-title{font-family:Georgia;font-size:14px;font-weight:700;
  color:var(--hunt);margin:0 0 10px}
.note{background:#fff6ec;border:1px solid var(--gold);border-left:4px solid var(--hunt);
  padding:9px 12px;font-size:12.5px;color:#4a463c;border-radius:0 var(--r) var(--r) 0;
  margin:10px 0}

/* ── KPI GRID ── */
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.kbox{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:12px 10px;text-align:center;box-shadow:var(--shadow)}
.kbox .k{font-family:Georgia;font-size:22px;font-weight:700;
  color:var(--hunt);line-height:1.1}
.kbox .l{font-size:10.5px;color:var(--muted);margin-top:3px}
.kbox.hi{background:rgba(47,71,52,.08);border-color:rgba(47,71,52,.3)}
.kbox.warn .k{color:var(--ox)}

/* ── HORIZONTAL BAR ── */
.hbar{margin:5px 0}
.hbar-label{display:flex;justify-content:space-between;font-size:12.5px;
  margin-bottom:3px;font-weight:600}
.hbar-track{background:var(--line);border-radius:3px;height:22px;position:relative;overflow:hidden}
.hbar-fill{position:absolute;top:0;left:0;height:100%;border-radius:3px;
  display:flex;align-items:center;padding-left:8px;
  font-size:11px;font-weight:700;color:#fff;white-space:nowrap;
  transition:width .4s ease}

/* ── STACKED BAR (100%) ── */
.sbar{display:flex;height:28px;border-radius:4px;overflow:hidden;margin:4px 0}
.sbar-seg{display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;color:#fff;transition:width .3s}
.sbar-label{font-size:12px;font-weight:700;color:var(--muted);
  margin-bottom:4px;margin-top:10px}

/* ── TABLES ── */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:7px 8px;text-align:center;border-bottom:1px solid var(--line)}
th{background:var(--hunt);color:#f3efe3;font-size:11px;font-weight:600;
  position:sticky;top:0}
td:first-child,th:first-child{text-align:left;font-weight:700;
  position:sticky;left:0;background:var(--card);z-index:2}
th:first-child{background:var(--hunt);z-index:3}
tr:nth-child(even) td{background:var(--alt)}
tr:nth-child(even) td:first-child{background:var(--alt)}
.heat-hi{background:rgba(47,71,52,.22)!important;font-weight:700}
.heat-lo{color:var(--muted)}

/* ── SELECTORS ── */
select{font:inherit;font-size:13px;padding:6px 10px;
  border:1px solid var(--line);border-radius:6px;
  background:var(--card);color:var(--ink);width:100%;margin-bottom:10px}
.toggle{display:flex;background:var(--line);border-radius:20px;padding:2px;margin-bottom:12px}
.toggle button{flex:1;font:inherit;font-size:12px;font-weight:600;padding:6px;
  border:none;border-radius:18px;background:transparent;color:var(--muted);cursor:pointer}
.toggle button.on{background:var(--hunt);color:#fff}

/* ── PROSE BROWSER ── */
.prose-card{background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:12px 14px;margin-bottom:8px}
.prose-label{font-family:Georgia;font-weight:700;color:var(--hunt);font-size:13px}
.prose-text{font-size:13px;color:var(--ink);margin-top:4px;line-height:1.55}

/* ── SVG CHARTS ── */
svg{display:block;width:100%;overflow:visible}
.chart-wrap{position:relative;overflow:visible}

/* ── LEGEND ── */
.legend{display:flex;flex-wrap:wrap;gap:8px;font-size:11.5px;
  color:var(--muted);margin-top:8px}
.legend span{display:flex;align-items:center;gap:4px}
.sw{width:10px;height:10px;border-radius:2px;flex-shrink:0}

/* ── TOUCH TOOLTIP ── */
#tip{display:none;position:fixed;z-index:100;background:var(--hunt);color:#fff;
  border-radius:8px;padding:10px 13px;font-size:12px;
  max-width:220px;box-shadow:0 4px 16px rgba(0,0,0,.3);pointer-events:none}

/* ── DELTA ── */
.pos{color:var(--hunt);font-weight:700}
.neg{color:var(--ox);font-weight:700}
</style>

function showTip(e,html){
  tip.innerHTML=html;tip.style.display="block";
  const touch=e.touches?e.touches[0]:e;
  tip.style.left=Math.min(touch.clientX+12,window.innerWidth-235)+"px";
  tip.style.top=Math.max(touch.clientY-80,8)+"px";
}
function hideTip(){tip.style.display="none";}
document.addEventListener("touchstart",e=>{if(!e.target.closest("svg"))hideTip();},{passive:true});

// ── AVG CHECK ────────────────────────────────────────────────────
(function(){
const ac=D.avg_check;
const SE_KEYS=SE;
const vals=DOW.map(d=>ac.by_day[d]);
const maxV=Math.max(...vals);
const dayBars=DOW.map((d,i)=>{const v=vals[i];const w=Math.round(v/maxV*100);
  const top=v===maxV;
  return`<div class="hbar">
    <div class="hbar-label"><span>${d}</span><span>$${v.toFixed(0)}</span></div>
    <div class="hbar-track">
      <div class="hbar-fill" style="width:${w}%;background:${top?OX:HUNT}">
        ${w>=18?"$"+v.toFixed(0):""}
      </div>
    </div>
  </div>`;}).join("");

// Day × season table
const dxs=ac.day_x_season||{};
const vals2=DOW.flatMap(d=>SE.map(s=>{const r=dxs[d+"|"+s];return r||null;})).filter(Boolean);
const lo=Math.min(...vals2),hi=Math.max(...vals2);
let tbl=`<div class="scroll"><table>
  <thead><tr><th>Day</th>${SE.map(s=>`<th>${s.slice(0,3)}</th>`).join("")}</tr></thead><tbody>`;
DOW.forEach(d=>{
  tbl+=`<tr><td>${d}</td>`;
  SE.forEach(s=>{const v=dxs[d+"|"+s];if(!v){tbl+=`<td>—</td>`;return;}
    const heat=(v-lo)/(hi-lo||1);
    const cls=heat>0.65?"heat-hi":heat<0.25?"heat-lo":"";
    tbl+=`<td class="${cls}">$${v.toFixed(0)}</td>`;
  });tbl+=`</tr>`;});
tbl+=`</tbody></table></div>`;

let h=`
<p class="section-title">Average Check</p>
<div class="kgrid" style="grid-template-columns:1fr 1fr;margin-bottom:14px">
  <div class="kbox hi" style="text-align:center;padding:16px">
    <div class="k" style="font-size:32px">${money(ac.dinner)}</div>
    <div class="l" style="font-size:12px">DINNER (exact)</div>
  </div>
  <div class="kbox" style="text-align:center;padding:16px;border-color:var(--gold)">
    <div class="k" style="font-size:26px;color:var(--clay)">${money(ac.lunch)}</div>
    <div class="l" style="font-size:12px">LUNCH (exact)</div>
  </div>
</div>
<div class="card">
  <div class="card-title">By day of week (exact)</div>
  ${dayBars}
</div>
<div class="card">
  <div class="card-title">Day × season matrix (exact)</div>
  ${tbl}
  <div class="lede" style="margin:8px 0 0;font-size:11.5px">Darker = higher avg check.</div>
</div>`;
el("pg_ac").innerHTML=h;
})();

// ── TIME OF DAY ──────────────────────────────────────────────────
(function(){
const tod=D.tod;
const HRS=tod.hrs;const HL=tod.hrlab;
const pcts=tod.covers_pct;const chks=tod.check;
const GRP_COL={
  "Pasta":HUNT,"Mains (entrée/sandwich)":SAGE,
  "Starters & shares":BLUE,"Dessert":CLAY,
  "Wine":OX,"Cocktails/spirits":GOLD,"Beer + NA":GREY
};
// Inline SVG bar chart
const W=340,H=180,L=32,R=12,T=8,B=26;
const x=(i,n)=>L+i*(W-L-R)/n+(W-L-R)/n/2;
const yP=v=>H-B-v/22*(H-T-B);
const yK=v=>H-B-(v-40)/(145-40)*(H-T-B);
let svg='';
[0,5,10,15,20].forEach(v=>{
  svg+=`<line x1="${L}" y1="${yP(v)}" x2="${W-R}" y2="${yP(v)}" stroke="#e6ddc7"/>`;
  svg+=`<text x="${L-2}" y="${yP(v)+3}" text-anchor="end" font-size="8" fill="${GREY}">${v}%</text>`;});
[60,90,120].forEach(v=>svg+=`<text x="${W-R+2}" y="${yK(v)+3}" font-size="8" fill="#8a6d1f">$${v}</text>`);
const bw=(W-L-R)/HRS.length*0.7;
// 4pm line
const i4=HRS.indexOf(16);if(i4>=0)svg+=`<line x1="${x(i4,HRS.length)-bw/2-2}" y1="${T}" x2="${x(i4,HRS.length)-bw/2-2}" y2="${H-B}" stroke="${OX}" stroke-width="1" opacity=".4"/>`;
HRS.forEach((h,i)=>{
  const v=parseFloat(pcts[h]);const xc=x(i,HRS.length);
  svg+=`<rect x="${xc-bw/2}" y="${yP(v)}" width="${bw}" height="${H-B-yP(v)}" fill="${HUNT}" opacity=".85" rx="1"/>`;
  if(v>=4)svg+=`<text x="${xc}" y="${yP(v)-2}" text-anchor="middle" font-size="7.5" font-weight="700" fill="${HUNT}">${v}%</text>`;
  svg+=`<text x="${xc}" y="${H-B+13}" text-anchor="middle" font-size="8" fill="${GREY}">${HL[h]}</text>`;
});
// Check line
let path=HRS.map((h,i)=>`${i?"L":"M"}${x(i,HRS.length).toFixed(1)},${yK(parseFloat(chks[h])).toFixed(1)}`).join(" ");
svg+=`<path d="${path}" fill="none" stroke="${GOLD}" stroke-width="2"/>`;
HRS.forEach((h,i)=>svg+=`<circle cx="${x(i,HRS.length)}" cy="${yK(chks[h])}" r="2.5" fill="${GOLD}"/>`);

// When-ordered line chart (mini)
const WHEN=[
  ["glass of wine",OX,"Glass"],["specialty cocktail",GOLD,"Spec. cocktail"],
  ["classic cocktail",CLAY,"Classic"],["dessert",HUNT,"Dessert"],
  ["soda/tea/coffee",GREY,"Coffee/soda"],
];
const W2=320,H2=160,L2=28,R2=72,T2=8,B2=22;
const x2=(i)=>L2+i*(W2-L2-R2)/(HRS.length-1);
const y2=v=>H2-B2-v/55*(H2-T2-B2);
let svg2='';
[0,25,50].forEach(v=>{
  svg2+=`<line x1="${L2}" y1="${y2(v)}" x2="${W2-R2}" y2="${y2(v)}" stroke="#e6ddc7"/>`;
  svg2+=`<text x="${L2-2}" y="${y2(v)+3}" text-anchor="end" font-size="8" fill="${GREY}">${v}%</text>`;});
WHEN.forEach(([key,col,lbl],si)=>{
  const pts=HRS.map((h,i)=>{const v=tod.byhour[String(h)]&&tod.byhour[String(h)][key];return v!=null?[x2(i),y2(v)]:null;}).filter(Boolean);
  if(!pts.length)return;
  const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  svg2+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="1.8"/>`;
  const last=pts[pts.length-1];
  svg2+=`<text x="${last[0]+3}" y="${last[1]+4+(si%3)*10}" font-size="8.5" font-weight="700" fill="${col}">${lbl}</text>`;});
HRS.forEach((h,i)=>{if(i%2===0||h===18)svg2+=`<text x="${x2(i)}" y="${H2-B2+12}" text-anchor="middle" font-size="8" fill="${GREY}">${HL[h]}</text>`;});

let h=`
<p class="section-title">Time of Day</p>
<p class="lede">Bars = % of day's checks opening that hour. Gold line = modeled avg check.</p>
<div class="card">
  <div class="card-title">Covers & avg check by hour</div>
  <svg viewBox="0 0 ${W} ${H}" style="width:100%">${svg}</svg>
  <div class="legend">
    <span><span class="sw" style="background:${HUNT}"></span>% of checks</span>
    <span><span class="sw" style="background:${GOLD}"></span>Avg check ($)</span>
    <span style="font-size:11px;color:var(--muted)">│ = 4pm split</span>
  </div>
</div>
<div class="card">
  <div class="card-title">What's ordered when</div>
  <svg viewBox="0 0 ${W2} ${H2}" style="width:100%">${svg2}</svg>
</div>
<div class="note">6pm = 16% of all checks, peak avg check of $131. 5p–7p together = 45% of daily volume.</div>`;
el("pg_tod").innerHTML=h;
})();

// ── PARTY SIZE ────────────────────────────────────────────────────
(function(){
const pa=D.party;const po=pa.overall;const bw=pa.booked;
const LABS=pa.labels;
function fv(v,i){return i===0?money(v):(v*100).toFixed(0)+"%";}
const avg_checks=BANDS.map(b=>{const r=po["Avg check ($)"]&&po["Avg check ($)"][b];return r?r.v:0;});
const maxAC=Math.max(...avg_checks);
let acBars=BANDS.map((b,i)=>{const v=avg_checks[i];const w=Math.round(v/maxAC*100);
  return`<div class="hbar">
    <div class="hbar-label"><span style="color:${BAND_COL[b]};font-weight:700">${b}</span><span>$${Math.round(v)}</span></div>
    <div class="hbar-track"><div class="hbar-fill" style="width:${w}%;background:${BAND_COL[b]}">${w>=18?"$"+Math.round(v):""}</div></div>
  </div>`;}).join("");

// Full metrics table
let tbl=`<div class="scroll"><table>
  <thead><tr><th>Metric</th>${BANDS.map(b=>`<th style="background:${BAND_COL[b]}">${b.split(" ")[0]}</th>`).join("")}</tr></thead><tbody>`;
LABS.forEach((lab,i)=>{tbl+=`<tr><td>${lab}</td>${BANDS.map(b=>{
  const r=po[lab]&&po[lab][b];const v=r?r.v:null;
  return`<td>${v==null?"—":fv(v,i)}</td>`;}).join("")}</tr>`;});
tbl+=`</tbody></table></div>`;

// Booked vs walk-in

  const d=r.booked-r.walkin;const dstr=i===0?(d>=0?"+$":"-$")+Math.abs(Math.round(d)):(d>=0?"+":"")+Math.round(d*100)+"pp";
  return`<tr><td>${lab}</td><td>${fv(r.walkin,i)}</td><td style="font-weight:700">${fv(r.booked,i)}</td>
    <td class="${d>=0?"pos":"neg"}">${dstr}</td></tr>`;}).join("");

let h=`
<p class="section-title">Party Size</p>
<p class="lede">${pa.total.toLocaleString()} checks joined to party size via SevenRooms (87% coverage).</p>
<div class="card">
  <div class="card-title">Avg check by party size</div>
  ${acBars}
</div>
<div class="card">
  <div class="card-title">All metrics by party size</div>
  ${tbl}
</div>
<div class="card">
  <div class="card-title">Booked vs walk-in</div>
  <div class="scroll"><table>
    <thead><tr><th>Metric</th><th>Walk-in</th><th>Booked</th><th>Δ</th></tr></thead>
    <tbody>${bwRows}</tbody></table></div>
</div>
<div class="note"><b>4-top = bottle table.</b> Bottle attach: 11% at 2-tops → 18% at 4-tops (+64% relative). Booked tables spend $64 more and order dessert at 2× the rate.</div>`;
el("pg_ps").innerHTML=h;
})();
