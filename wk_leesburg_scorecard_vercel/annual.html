<title>WK Leesburg · Complete Analytics</title>
<style>
:root{--hunt:#2F4734;--ox:#6B2227;--gold:#B08D2B;--parch:#F4EEE1;--ink:#1E1E1E;
--line:#d8cdb6;--card:#fbf7ee;--muted:#6f6a5c;--alt:#f6efe0;--none:#e3dcc9;
--blue:#3d6a7a;--clay:#a8632f;--sage:#6b8e6f}
*{box-sizing:border-box}
body{margin:0;background:var(--parch);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,.serif{font-family:Georgia,"Times New Roman",serif}
.top{position:sticky;top:0;z-index:30;background:var(--hunt);padding:10px 16px 0}
.brand{display:flex;align-items:baseline;gap:10px;max-width:1200px;margin:0 auto;flex-wrap:wrap}
.brand b{font-family:Georgia,serif;font-size:17px;color:#fff}
.brand span{font-size:11.5px;color:#cdd7cc}
.tabs{display:flex;gap:1px;max-width:1200px;margin:8px auto 0;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{font:inherit;font-size:12.5px;font-weight:600;padding:8px 12px;border:none;background:transparent;color:#cdd7cc;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;transition:color .15s}
.tab.on{color:#fff;border-bottom-color:var(--gold)}
.tab:hover:not(.on){color:#e8e3d8}
.wrap{max-width:1200px;margin:0 auto;padding:20px 14px 90px}
section.pane{display:none} section.pane.on{display:block}
h2.sec{font-size:22px;color:var(--hunt);margin:0 0 4px;border-bottom:2px solid var(--gold);padding-bottom:7px}
.lede{color:var(--muted);font-size:13.5px;margin:6px 0 16px;max-width:88ch}
h3.blk{font-family:Georgia,serif;font-size:14.5px;color:var(--hunt);margin:22px 0 7px}
h4.sub{font-size:13px;color:var(--muted);font-family:Georgia,serif;margin:14px 0 5px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px}
.card.tight{padding:10px 14px}
.kpi{display:grid;gap:9px;margin:6px 0 14px}
.kpi.c5{grid-template-columns:repeat(5,1fr)}
.kpi.c4{grid-template-columns:repeat(4,1fr)}
.kpi.c3{grid-template-columns:repeat(3,1fr)}
.kbox{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:11px 10px;text-align:center}
.kbox.hi{background:rgba(47,71,52,.09);border-color:rgba(47,71,52,.3)}
.kbox.warn{background:#f6efe0;border-color:var(--gold)}
.kbox .k{font-family:Georgia,serif;font-size:20px;font-weight:700;color:var(--hunt);line-height:1.1}
.kbox.warn .k{color:var(--ox)}
.kbox .l{font-size:10.5px;color:var(--muted);margin-top:4px}
.note{background:#fff6ec;border:1px solid var(--gold);border-left:4px solid var(--hunt);padding:8px 12px;font-size:12.5px;color:#4a463c;border-radius:0 4px 4px 0;margin:10px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;align-items:center}
.ctrl label{font-size:11.5px;font-weight:700;color:var(--muted)}
select,input[type=range]{font:inherit;font-size:12.5px;padding:4px 7px;border:1px solid var(--line);border-radius:5px;background:var(--card);color:var(--ink);cursor:pointer}
select:focus{outline:2px solid var(--gold);border-color:var(--gold)}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:6px 8px;text-align:center;border:1px solid var(--line)}
th{background:var(--hunt);color:#f3efe3;font-weight:600;font-size:11px;position:sticky;top:0}
td:first-child,th:first-child{text-align:left;font-weight:700}
tr:nth-child(even) td{background:var(--alt)}
.scroll{overflow-x:auto}
.hbar-row{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:12.5px}
.hbar-row .lbl{min-width:130px;font-weight:600}
.hbar-row .bar{flex:1;background:var(--line);border-radius:3px;height:15px;position:relative}
.hbar-row .bar span{display:block;height:100%;border-radius:3px;position:absolute;top:0;left:0}
.hbar-row .val{min-width:90px;text-align:right;color:var(--muted);font-size:12px}
.legend{display:flex;gap:12px;font-size:11.5px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:4px}
.sw{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.met-row{display:grid;grid-template-columns:1fr auto 90px auto;align-items:center;gap:6px;padding:3px 0;border-bottom:1px solid var(--none);font-size:12.5px}
.met-row:last-child{border:none}
.met-bar{height:8px;border-radius:2px;background:var(--none);position:relative;width:90px}
.met-bar span{display:block;height:100%;border-radius:2px;position:absolute;top:0;left:0}
.met-val{font-weight:700;font-size:13px;text-align:right}
.delta-pos{color:var(--hunt);font-weight:700;font-size:11px}
.delta-neg{color:var(--ox);font-weight:700;font-size:11px}
ul.di{list-style:none;padding:0;margin:8px 0}
ul.di li{position:relative;padding-left:18px;margin-bottom:7px;font-size:13.5px}
ul.di li:before{content:"◆";color:var(--gold);position:absolute;left:0;font-size:10px;top:3px}
.prose-card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:6px}
.prose-label{font-family:Georgia,serif;font-weight:700;color:var(--hunt);font-size:13px}
.prose-text{font-size:12.5px;color:var(--ink);margin-top:3px}
.prose-n{font-size:11px;color:var(--muted)}
svg{display:block}
@media(max-width:700px){.two,.three{grid-template-columns:1fr}.kpi.c5,.kpi.c4{grid-template-columns:repeat(2,1fr)}}
</style>

function hbars(elid,rows,fmtFn,maxv){
  const max=maxv||Math.max(...rows.map(r=>r.v||0),0.01);
  el(elid).innerHTML=rows.map(r=>{
    const w=Math.round((r.v||0)/max*100);
    return `<div class="hbar-row"><div class="lbl">${r.l}</div>
      <div class="bar"><span style="width:${w}%;background:${r.c||HUNT}"></span></div>
      <div class="val">${fmtFn(r)}</div></div>`;
  }).join('');
}

function svgBars(elid,labels,vals,cols,lo,hi,W,H,L,R,T,B,fmtFn){
  const bw=(W-L-R)/labels.length; const y=v=>H-B-(v-lo)/(hi-lo||1)*(H-T-B);
  let g='';
  for(let v=lo;v<=hi;v+=(hi-lo)/4){
    g+=`<line x1="${L}" y1="${y(v)}" x2="${W-R}" y2="${y(v)}" stroke="#e6ddc7"/>
    <text x="${L-5}" y="${y(v)+3}" text-anchor="end" font-size="9" fill="${GREY}">${fmtFn(v)}</text>`;}
  labels.forEach((lbl,i)=>{
    const v=vals[i]; if(v==null) return;
    const x=L+i*bw+bw/2; const col=Array.isArray(cols)?cols[i]:cols;
    g+=`<rect x="${L+i*bw+bw*0.15}" y="${y(v)}" width="${bw*0.7}" height="${H-B-y(v)}" fill="${col}" rx="2"/>
    <text x="${x}" y="${y(v)-4}" text-anchor="middle" font-size="9.5" font-weight="700" fill="${col}">${fmtFn(v)}</text>
    <text x="${x}" y="${H-B+14}" text-anchor="middle" font-size="9.5">${lbl}</text>`;
  });
  el(elid).innerHTML=g;
}

function heatTable(elid,rows,cols,getv,fmtFn,rowlabel){
  const vals=rows.flatMap(r=>cols.map(c=>{const v=getv(r,c);return v!=null?v:null})).filter(v=>v!=null);
  if(!vals.length){el(elid).innerHTML='<div style="color:var(--muted);font-size:12px;padding:8px">No data</div>';return;}
  const lo=Math.min(...vals),hi=Math.max(...vals);
  let t=`<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12.5px">`;
  t+=`<thead><tr><th style="background:var(--hunt);color:#fff;padding:6px 8px;text-align:left">${rowlabel||''}</th>${cols.map(c=>`<th style="background:var(--hunt);color:#fff;padding:6px 8px">${c}</th>`).join('')}</tr></thead><tbody>`;
  rows.forEach(r=>{
    t+=`<tr><td style="font-weight:700;padding:6px 8px;border:1px solid var(--line)">${r}</td>`;
    cols.forEach(c=>{const v=getv(r,c); if(v==null){t+=`<td style="padding:6px 8px;border:1px solid var(--line);color:var(--muted);font-style:italic">n/a</td>`;return;}
      const heat=(v-lo)/(hi-lo||1);
      const bg=`rgba(47,71,52,${(0.07+heat*0.7).toFixed(2)})`;const fg=heat>0.55?"#fff":INK;
      t+=`<td style="background:${bg};color:${fg};font-weight:700;padding:6px 8px;border:1px solid var(--line);text-align:center">${fmtFn(v)}</td>`;
    });t+=`</tr>`;
  });
  el(elid).innerHTML=t+'</tbody></table></div>';
}

(function(){

const QC={Star:HUNT,Puzzle:GOLD,Plowhorse:OX,Dog:GREY};

let h=`<h2 class="sec">Menu Engineering</h2>

<div class="kpi c4">
${[[k.n_items,'Priced items'],['$'+k.total_contrib.toLocaleString(),'Total contribution'],
   [k.food_theo+'% → '+k.food_actual+'%','Food cost: recipe → actual'],
   ['$'+k.leak_wk.toLocaleString()+'/wk','Cost leakage ('+k.leak_pts+' pts)',1]]
  .map(x=>`<div class="kbox${x[2]?' warn':''}"><div class="k">${x[0]}</div><div class="l">${x[1]}</div></div>`).join('')}
</div>
<div class="card"><h3 class="blk" style="margin-top:0">Menu-engineering map <span style="font-size:11px;color:var(--muted);font-weight:400">— x = units sold · y = contribution $/item · color = quadrant</span></h3>
<svg id="me_scatter" viewBox="0 0 800 380" width="100%"></svg>
<div class="legend">${Object.entries(QC).map(([q,c])=>`<span><span class="sw" style="background:${c}"></span>${q}</span>`).join('')}</div></div>
<div id="me_tooltip" style="display:none;position:fixed;z-index:100;background:var(--hunt,#2b2b2b);color:#fff;border-radius:8px;padding:9px 12px;font-size:12px;line-height:1.5;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.28);max-width:230px"></div>
<div class="two">
<div class="card"><h3 class="blk" style="margin-top:0">Puzzles — high margin, low volume (PUSH)</h3>
<table><thead><tr><th>Item</th><th>Sold</th><th>Margin</th><th>$/item</th></tr></thead><tbody>
${ME.push.map(r=>`<tr><td>${r.name}</td><td>${r.sold}</td><td>${r.margin}%</td><td>$${r.per.toFixed(2)}</td></tr>`).join('')}</tbody></table></div>
<div class="card"><h3 class="blk" style="margin-top:0">Stars — profit engines (protect / feature)</h3>
<table><thead><tr><th>Item</th><th>Sold</th><th>Contribution</th><th>Margin</th></tr></thead><tbody>
${ME.stars.map(r=>`<tr><td>${r.name}</td><td>${r.sold}</td><td>$${r.contrib.toLocaleString()}</td><td>${r.margin}%</td></tr>`).join('')}</tbody></table></div></div>
<div class="two">
<div class="card"><h3 class="blk" style="margin-top:0">Plowhorses — popular but thin (re-cost / re-price)</h3>
<table><thead><tr><th>Item</th><th>Sold</th><th>Margin</th><th>$/item</th></tr></thead><tbody>
${ME.traps.map(r=>`<tr><td>${r.name}</td><td>${r.sold}</td><td>${r.margin}%</td><td>$${r.per.toFixed(2)}</td></tr>`).join('')}</tbody></table></div>
<div class="card"><h3 class="blk" style="margin-top:0">Contribution by category</h3><div id="me_cat"></div></div></div>
<div class="card"><h3 class="blk" style="margin-top:0">Recipe cost-mapping errors — ${k.mispriced_n} drinks costed above menu price</h3>
<table><thead><tr><th>Item</th><th>Recipe cost</th><th>Menu price</th></tr></thead><tbody>
${ME.mispriced.slice(0,12).map(r=>`<tr><td>${r.name}</td><td class="delta-neg">$${r.cost.toFixed(2)}</td><td>$${r.price.toFixed(2)}</td></tr>`).join('')}</tbody></table>
<div class="note">These are recipe-build errors (a batch/prep quantity attached at full scale). They inflate COGS and distort margins until fixed at the ingredient level.</div></div>`;
el('pane_menueng').innerHTML=h;
(function(){const W=800,H=380,L=48,R=16,T=14,B=34;const its=ME.items;
 const xmax=Math.max(...its.map(d=>d.sold)),ymax=Math.max(...its.map(d=>d.per)),ymin=Math.min(...its.map(d=>d.per),0);
 const sx=v=>L+Math.sqrt(v)/Math.sqrt(xmax)*(W-L-R), sy=v=>H-B-(v-ymin)/(ymax-ymin)*(H-T-B);
 let g='';const mx=sx(ME.med_sold),my=sy(ME.med_per);
 g+=`<line x1="${mx}" y1="${T}" x2="${mx}" y2="${H-B}" stroke="#d8cdb6" stroke-dasharray="4 3"/><line x1="${L}" y1="${my}" x2="${W-R}" y2="${my}" stroke="#d8cdb6" stroke-dasharray="4 3"/>`;
 g+=`<text x="${L}" y="${H-6}" font-size="9" fill="${GREY}">fewer sold</text><text x="${W-R}" y="${H-6}" text-anchor="end" font-size="9" fill="${GREY}">more sold →</text><text x="6" y="${T+8}" font-size="9" fill="${GREY}">$/item</text>`;
 its.forEach((d,i)=>{const c=QC[d.quad]||GREY;g+=`<circle class="me-dot" data-i="${i}" cx="${sx(d.sold).toFixed(1)}" cy="${sy(d.per).toFixed(1)}" r="4" fill="${c}" opacity="0.82" style="cursor:pointer"></circle>`;});
 its.filter(d=>d.per>=ME.med_per*1.7||d.sold>=xmax*0.55).slice(0,9).forEach(d=>{g+=`<text x="${(sx(d.sold)+6).toFixed(1)}" y="${(sy(d.per)-4).toFixed(1)}" font-size="8.5" fill="${INK}">${d.name.slice(0,20)}</text>`;});
 el('me_scatter').innerHTML=g;
 const tip=el('me_tooltip');
 const fmtMoney=v=>'$'+Number(v).toLocaleString(undefined,{maximumFractionDigits:0});
 el('me_scatter').querySelectorAll('.me-dot').forEach(node=>{
   node.addEventListener('mouseenter',ev=>{const d=its[+node.getAttribute('data-i')];const c=QC[d.quad]||GREY;
     tip.innerHTML=`<div style="font-weight:700;margin-bottom:4px">${d.name}</div>`
       +`<div style="color:${c};font-weight:600;margin-bottom:5px">${d.quad}${d.type?' · '+d.type:''}</div>`
       +`<div>${d.sold.toLocaleString()} sold · $${d.per.toFixed(2)}/item</div>`
       +`<div>${d.margin}% margin · ${fmtMoney(d.contrib)} contribution</div>`
       +`<div style="opacity:.75;margin-top:3px">Revenue ${fmtMoney(d.rev)} · Cost ${fmtMoney(d.cost)}</div>`;
     tip.style.display='block';});
   node.addEventListener('mousemove',ev=>{const pad=14;let x=ev.clientX+pad,y=ev.clientY+pad;
     const w=tip.offsetWidth,ht=tip.offsetHeight;
     if(x+w>window.innerWidth-8)x=ev.clientX-w-pad;
     if(y+ht>window.innerHeight-8)y=ev.clientY-ht-pad;
     tip.style.left=x+'px';tip.style.top=y+'px';});
   node.addEventListener('mouseleave',()=>{tip.style.display='none';});
 });})();
hbars('me_cat', ME.by_cat.slice(0,9).map(c=>({l:c.type,v:c.contrib,c:HUNT})), r=>`$${r.v.toLocaleString()} · ${(ME.by_cat.find(x=>x.type===r.l)||{}).margin}%`);
})();


// ── FLIGHTS ──────────────────────────────────────────────────────────
(function(){
const FA=D.flights;
const tb=document.querySelector('[data-t="flights"]');
if(!FA||!FA.seasons){ if(tb) tb.style.display='none'; return; }
const WC={red:'#7b2d3a',white:'#c9a94e',sparkling:'#e0cf9a',rose:'#d98a9a',
          fortified:'#5a3a2a',dessert:'#b8892b',orange:'#c8772e'};
const wc=c=>WC[c]||GREY;
const money=v=>'$'+Number(v).toLocaleString();
const seasons=FA.season_order||Object.keys(FA.seasons);

// static shell (season toggle + containers)
let shell=`<h2 class="sec">Flights</h2>
<p class="lede">Every wine flight sold ${FA.period}. <b>Units, price and price-mix</b> are exact from Toast for all flights. <b>Color, region and grape</b> come from the actual wines, reconstructed by decoding each flight's iteration code against dated wine-list menus — currently ${FA.match_pct}% of flights poured, from ${FA.n_menus} menus. Uploading more dated lists raises that coverage. Use the season toggle to see how the mix shifts through the year.</p>
<div id="fl_seasonbar" style="display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px">
${seasons.map((s,i)=>`<button class="fl-season" data-s="${s}" style="padding:6px 15px;border:1px solid #d8cdb6;border-radius:20px;background:${i==0?'var(--hunt,#2b3d31)':'#fff'};color:${i==0?'#fff':'var(--ink,#2b2b2b)'};font-size:13px;cursor:pointer">${s}</button>`).join('')}</div>
<div id="fl_kpi" class="kpi c4"></div>
<div class="two">
<div class="card"><h3 class="blk" style="margin-top:0">Color mix by sales <span style="font-size:11px;color:var(--muted);font-weight:400">— glasses poured</span></h3><div id="fl_color"></div></div>
<div class="card"><h3 class="blk" style="margin-top:0">Price mix by sales</h3><div id="fl_price"></div></div></div>
<div class="two">
<div class="card"><h3 class="blk" style="margin-top:0">Region by sales <span style="font-size:11px;color:var(--muted);font-weight:400">— verified-composition iterations only</span></h3><div id="fl_region"></div></div>
<div class="card"><h3 class="blk" style="margin-top:0">Grape / blend by sales <span style="font-size:11px;color:var(--muted);font-weight:400">— verified only</span></h3><div id="fl_grape"></div></div></div>
<div class="card"><h3 class="blk" style="margin-top:0">Price vs sales by flight <span style="font-size:11px;color:var(--muted);font-weight:400">— each dot a flight · x = price · y = units sold · color = lead wine · outlined = exact composition · hover for detail</span></h3>
<svg id="fl_scatter" viewBox="0 0 800 360" width="100%"></svg>
<div id="fl_tooltip" style="display:none;position:fixed;z-index:100;background:var(--hunt,#2b2b2b);color:#fff;border-radius:8px;padding:9px 12px;font-size:12px;line-height:1.5;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.28);max-width:260px"></div></div>
<div class="two">
<div class="card"><h3 class="blk" style="margin-top:0">Which regions lift sales <span style="font-size:11px;color:var(--muted);font-weight:400">— avg units when on a flight vs not (verified only)</span></h3><div id="fl_region_lift"></div></div>
<div class="card"><h3 class="blk" style="margin-top:0">Which grapes lift sales <span style="font-size:11px;color:var(--muted);font-weight:400">— verified only</span></h3><div id="fl_grape_lift"></div></div></div>
<div class="card"><h3 class="blk" style="margin-top:0">Iterations by sales — pick a concept</h3>
<p class="note" style="margin-top:0">Sales, price and net are exact for every iteration. Wines are the real menu list for that iteration, recovered by decoding its code (e.g. Pinot Envy <b>LVB</b> = <b>L</b>emelson · <b>V</b>incent Ravaut · <b>B</b>irichino) against dated wine lists. Iterations from dates not yet uploaded show their code and "not yet recovered" — send that menu and they fill in.</p>
<select id="fl_concept" style="padding:7px 10px;border:1px solid #d8cdb6;border-radius:7px;font-size:14px;margin-bottom:10px;background:#fff"></select>
<div id="fl_iters"></div></div>`;
el('pane_flights').innerHTML=shell;

function liftTable(rows,label){
  return `<table><thead><tr><th>${label}</th><th>Flights</th><th>Avg w/</th><th>Avg w/o</th><th>Lift</th></tr></thead><tbody>`
   +rows.slice(0,12).map(r=>`<tr><td>${r.k}</td><td>${r.flights}</td><td>${r.avg_with}</td><td>${r.avg_without}</td><td class="${r.lift_pct>0?'delta-pos':'delta-neg'}">${r.lift_pct==null?'—':(r.lift_pct>0?'+':'')+r.lift_pct+'%'}</td></tr>`).join('')
   +`</tbody></table>`;
}
function renderSeason(S){
  const F=FA.seasons[S];
  // KPIs
  el('fl_kpi').innerHTML=[[F.total_units.toLocaleString(),'Flights poured'],[F.n_flights,'Distinct flight items'],
    [F.concepts.length,'Flight concepts'],[Math.round(F.verified_units/F.total_units*100)+'%','Composition recovered']]
    .map(x=>`<div class="kbox"><div class="k">${x[0]}</div><div class="l">${x[1]}</div></div>`).join('');
  hbars('fl_color',F.color_by_sales.map(x=>({l:x.k,v:x.u,c:wc(x.k)})),r=>r.v.toLocaleString()+' poured');
  hbars('fl_price',F.price_by_sales.map(x=>({l:x.k,v:x.u,c:HUNT})),r=>r.v.toLocaleString()+' poured');
  hbars('fl_region',F.region_by_sales.map(x=>({l:x.k,v:x.u,c:GOLD})),r=>r.v.toLocaleString());
  hbars('fl_grape',F.grape_by_sales.map(x=>({l:x.k,v:x.u,c:OX})),r=>r.v.toLocaleString());
  el('fl_region_lift').innerHTML=liftTable(F.region_lift,'Region');
  el('fl_grape_lift').innerHTML=liftTable(F.grape_lift,'Grape');
  // scatter
  (function(){const W=800,H=360,L=52,R=18,T=16,B=40;const its=F.scatter.filter(d=>d.price>0);
   if(!its.length){el('fl_scatter').innerHTML='';return;}
   const xs=its.map(d=>d.price),ys=its.map(d=>d.units);
   const xmin=Math.min(...xs)-1,xmax=Math.max(...xs)+1,ymax=Math.max(...ys,1)*1.05;
   const sx=v=>L+(v-xmin)/(xmax-xmin)*(W-L-R), sy=v=>H-B-v/ymax*(H-T-B);
   let g='';
   const rng=xmax-xmin, step=rng>60?10:rng>30?5:rng>12?2:1, p0=Math.ceil(xmin/step)*step;
   for(let p=p0;p<=xmax;p+=step){const x=sx(p);g+=`<line x1="${x}" y1="${T}" x2="${x}" y2="${H-B}" stroke="#efe9db"/><text x="${x}" y="${H-8}" text-anchor="middle" font-size="9.5" fill="${GREY}">$${p}</text>`;}
   g+=`<text x="6" y="${T+8}" font-size="9" fill="${GREY}">units</text>`;
   its.forEach((d,i)=>{const c=wc(d.color);g+=`<circle class="fl-dot" data-i="${i}" cx="${sx(d.price).toFixed(1)}" cy="${sy(d.units).toFixed(1)}" r="5" fill="${c}" opacity="0.82" stroke="${d.verified?INK:'none'}" stroke-width="${d.verified?1:0}" style="cursor:pointer"></circle>`;});
   el('fl_scatter').innerHTML=g;
   const tip=el('fl_tooltip');
   el('fl_scatter').querySelectorAll('.fl-dot').forEach(node=>{
     node.addEventListener('mouseenter',()=>{const d=its[+node.getAttribute('data-i')];
       tip.innerHTML=`<div style="font-weight:700;margin-bottom:3px">${d.item}</div>`
        +`<div style="margin-bottom:4px">$${d.price} · ${d.units.toLocaleString()} sold · ${d.verified?'menu-verified':'wines not yet recovered'}</div>`
        +`<div style="opacity:.85">${(d.colors||[]).join(', ')||'—'}</div>`
        +`<div style="opacity:.7;font-size:11px">${(d.regions||[]).slice(0,4).join(' · ')}</div>`;
       tip.style.display='block';});
     node.addEventListener('mousemove',ev=>{const pad=14;let x=ev.clientX+pad,y=ev.clientY+pad;
       if(x+tip.offsetWidth>window.innerWidth-8)x=ev.clientX-tip.offsetWidth-pad;
       if(y+tip.offsetHeight>window.innerHeight-8)y=ev.clientY-tip.offsetHeight-pad;
       tip.style.left=x+'px';tip.style.top=y+'px';});
     node.addEventListener('mouseleave',()=>{tip.style.display='none';});
   });})();
  // concept drilldown
  const sel=el('fl_concept'); const prev=sel.value; sel.innerHTML='';
  F.concepts.forEach((c,i)=>{const o=document.createElement('option');o.value=i;o.textContent=`${c.concept} — ${c.total_units.toLocaleString()} sold, ${c.n_iter} iteration${c.n_iter>1?'s':''}`;sel.appendChild(o);});
  function renderConcept(){const c=F.concepts[+sel.value]; if(!c){el('fl_iters').innerHTML='';return;}
    let t=`<table><thead><tr><th>Iteration</th><th>Price</th><th>Sold</th><th>Net</th><th>Wines (color · region)</th></tr></thead><tbody>`;
    c.iterations.forEach(it=>{
      let cell;
      if(it.verified){
        cell=it.wines.map(w=>`<span style="white-space:nowrap"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${wc(w.color)};margin-right:3px"></span>${w.name}${w.region?` <span style="color:var(--muted)">(${w.region.split(',')[0]})</span>`:''}</span>`).join('<br>')||'—';
      } else {
        cell=`<span style="color:var(--muted);font-style:italic">wines not yet recovered${it.code?` · code ${it.code}`:''} — upload that dated wine list</span>`;
      }
      t+=`<tr><td>${it.item}</td><td>$${it.price}</td><td>${it.units.toLocaleString()}</td><td>${money(it.net)}</td><td style="font-size:12px">${cell}</td></tr>`;});
    t+=`</tbody></table>`; el('fl_iters').innerHTML=t;}
  if(prev && +prev<F.concepts.length) sel.value=prev;
  sel.onchange=renderConcept; renderConcept();
}
// season toggle wiring
el('fl_seasonbar').querySelectorAll('.fl-season').forEach(btn=>{
  btn.onclick=()=>{el('fl_seasonbar').querySelectorAll('.fl-season').forEach(b=>{b.style.background='#fff';b.style.color='var(--ink,#2b2b2b)';});

renderSeason(seasons[0]);
})();
