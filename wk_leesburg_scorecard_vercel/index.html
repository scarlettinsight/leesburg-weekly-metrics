<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WK Leesburg · Weekly Scorecard</title>
<style>
:root{--hunt:#2F4734;--ox:#6B2227;--gold:#B08D2B;--parch:#F4EEE1;
  --ink:#1E1E1E;--line:#d8cdb6;--card:#fbf7ee;--muted:#6f6a5c;--alt:#f3ede0;
  --up:#1a6b3a;--dn:#8b1a1a;--neu:#5a5246;--r:10px}
*{box-sizing:border-box}
body{margin:0;background:var(--parch);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:14px;line-height:1.45;padding-bottom:60px}
h1,h2,h3{font-family:Georgia,serif}
.top{background:var(--hunt);padding:16px 20px 14px}
.top b{font-family:Georgia;font-size:20px;color:#fff;display:block}
.top .sub{font-size:12px;color:#adc4ad;margin-top:3px}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px}
h2.sec{font-size:19px;color:var(--hunt);border-bottom:2px solid var(--gold);
  padding-bottom:6px;margin:24px 0 6px}
.lede{color:var(--muted);font-size:13px;margin:4px 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin-bottom:12px;box-shadow:0 2px 6px rgba(0,0,0,.07)}
.card-title{font-family:Georgia;font-size:14px;font-weight:700;color:var(--hunt);margin:0 0 12px}
.note{background:#fff6ec;border:1px solid var(--gold);border-left:4px solid var(--hunt);
  padding:9px 13px;font-size:13px;color:#4a463c;border-radius:0 var(--r) var(--r) 0;margin:10px 0}
.note a{color:var(--hunt)}
.loading{text-align:center;padding:60px 20px;color:var(--muted);font-size:15px}
.loading .spinner{width:32px;height:32px;border:3px solid var(--line);border-top-color:var(--hunt);
  border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
select{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line);
  border-radius:6px;background:var(--card);color:var(--ink);cursor:pointer}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.ctrl label{font-size:12px;font-weight:700;color:var(--muted)}
.sc-table{width:100%;border-collapse:collapse;font-size:13px}
.sc-table th{background:var(--hunt);color:#f3efe3;padding:8px 10px;
  text-align:center;font-size:11.5px;font-weight:600;white-space:nowrap;position:sticky;top:0}
.sc-table th:first-child{text-align:left;min-width:190px}
.sc-table td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:center}
.sc-table td:first-child{text-align:left;font-weight:600}
.sc-table tr:nth-child(even) td{background:var(--alt)}
.sc-grouprow td{background:var(--hunt)!important;color:var(--gold);
  font-family:Georgia;font-weight:700;font-size:11px;text-transform:uppercase;
  letter-spacing:.5px;text-align:left;padding:5px 10px}
.d-up{color:var(--up);font-weight:700}
.d-dn{color:var(--dn);font-weight:700}
.d-neu{color:var(--neu)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;flex-shrink:0}
.metric-row{display:flex;justify-content:space-between;align-items:center;
  padding:5px 0;border-bottom:1px solid var(--line);font-size:12.5px;gap:8px}
.metric-row:last-child{border:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
svg{display:block;overflow:visible}
.hist-table{border-collapse:collapse;font-size:11.5px}
.hist-table td,.hist-table th{padding:5px 7px;border:1px solid var(--line);text-align:center}
.hist-table th{background:var(--hunt);color:#fff;font-size:10.5px}
@media(max-width:640px){.two{grid-template-columns:1fr}.sc-table{font-size:11.5px}}
</style>

const GROUPS = [["Revenue", ["avg_check", "dinner_avg", "lunch_avg", "net", "n", "dinner_n", "lunch_n"]], ["Revenue mix", ["food_pct", "wine_pct", "liq_pct", "beer_pct", "na_pct"]], ["Composition", ["pasta", "entree", "apps_snack", "dessert", "wine_any", "bottle", "glass", "flight", "cocktail", "specialty"]], ["Reservations", ["total_covers", "walkin_cover_pct", "booked_cover_pct", "avg_party", "cancel_n", "noshow_n"]], ["Table mix", ["pct_solo", "pct_2top", "pct_3top", "pct_4top", "pct_group"]], ["Party size composition", ["ps_avg_2top", "ps_avg_4top", "ps_bottle_2top", "ps_bottle_4top", "ps_dessert_2top", "ps_dessert_4top"]]];
const HUNT="#2F4734",OX="#6B2227",GOLD="#B08D2B",GREY="#9a9584";
const el=id=>document.getElementById(id);

function fv(v,fmt){
  if(v==null)return'—';
  if(fmt==='$')return '$'+parseFloat(v).toFixed(2);
  if(fmt==='n')return Number.isInteger(v)?String(v):parseFloat(v).toFixed(2);
  return parseFloat(v).toFixed(1)+'%';
}
function dclass(d){if(!d||d==='—')return'd-neu';return (d.startsWith('-'))?'d-dn':'d-up';}

function init(){
  const BL=window.__BL__, HIST=window.__HI__;
  const LW=HIST.length?HIST[HIST.length-1]:null;

  el('root').innerHTML=`
    <div id="banner"></div>
    <h2 class="sec">Latest Week vs Baselines</h2>
    <p class="lede">All 36 metrics vs the same week last year, the current season average,
    and the full Jun 2025–Jun 2026 annual baseline.
    <b style="color:var(--up)">Green</b> = above baseline · <b style="color:var(--dn)">Red</b> = below.</p>
    <div class="ctrl"><label>Week:</label><select id="week_sel"></select></div>
    <div class="card" style="overflow-x:auto" id="sc_table_wrap"></div>
    <div class="two">
      <div class="card"><div class="card-title">Top movers vs same week last year</div><div id="ly_mini"></div></div>
      <div class="card"><div class="card-title" id="seas_title">Top movers vs season baseline</div><div id="seas_mini"></div></div>
    </div>
    <h2 class="sec">Trend — Any Metric Over Time</h2>
    <p class="lede">All ${HIST.length} ingested week(s). Hover a point for details. Gold dashed line = baseline.</p>
    <div class="ctrl">
      <label>Metric:</label><select id="trend_met"></select>
      <label style="margin-left:6px">Baseline:</label>
      <select id="trend_bl"><option value="annual">Annual baseline</option><option value="season">Season baseline (avg)</option><option value="none">None</option></select>
    </div>
    <div class="card"><svg id="trend_svg" viewBox="0 0 900 240" width="100%"></svg>
      <div style="font-size:11.5px;color:var(--muted);margin-top:8px" id="trend_tip">Hover a point</div></div>
    <h2 class="sec">Week-by-Week History</h2>
    <p class="lede">Every ingested week. Darker cell = higher value. Click a cell to load that week above.</p>
    <div class="ctrl"><label>Metric:</label><select id="hist_met"></select></div>
    <div class="card" style="overflow-x:auto"><div id="hist_grid"></div></div>
    <h2 class="sec" style="margin-top:28px">How Updates Work</h2>
    <div class="card" style="font-size:13px;color:var(--muted)">
      This dashboard reads its data on every visit. When a new week is ingested and
      redeployed, everyone with the URL sees it automatically — no new link.</div>`;

  let activeWk=LW;
  const wsel=el('week_sel');
  wsel.innerHTML=HIST.map((w,i)=>`<option value="${i}"${i===HIST.length-1?' selected':''}>${w.date_range||w.week_key}</option>`).join('');
  wsel.onchange=()=>{activeWk=HIST[+wsel.value]; renderAll(activeWk); drawGrid();};

  function renderAll(wk){activeWk=wk;renderBanner(wk);renderTable(wk);
    renderMini('ly_mini',wk,'delta_ly');renderMini('seas_mini',wk,'delta_season');
    el('seas_title').textContent='Top movers vs season baseline ('+(wk?wk.season:'—')+')';}

  function renderBanner(wk){
    if(!wk){el('banner').innerHTML='<div class="note">No weeks ingested yet.</div>';return;}
    el('banner').innerHTML=`<div class="note"><b>${wk.date_range||wk.week_key}</b> · ${wk.n} checks ·
      ${wk.net?'$'+(wk.net/1000).toFixed(1)+'K net (modeled)':''} ·
      Avg check <b>$${wk.avg_check}</b> · Season: ${wk.season} · Same week LY: ${wk.same_week_ly||'—'}</div>`;}

  function renderTable(wk){
    if(!wk){el('sc_table_wrap').innerHTML='<p style="color:var(--muted);padding:12px">No week loaded.</p>';return;}
    const cmp=wk.comparisons||{};
    let t=`<table class="sc-table"><thead><tr><th>Metric</th><th>This week</th>
      <th>LY same wk<br><span style="font-weight:400;font-size:10px">${wk.same_week_ly||'—'}</span></th>
      <th>Δ LY</th><th>Season BL</th><th>Δ Season</th><th>Annual BL</th><th>Δ Annual</th></tr></thead><tbody>`;
    GROUPS.forEach(([gname,keys])=>{
      const rows=keys.filter(k=>cmp[k]); if(!rows.length)return;
      t+=`<tr class="sc-grouprow"><td colspan="8">${gname}</td></tr>`;
      rows.forEach(key=>{
        const m=METS.find(x=>x[0]===key)||[key,key,'%','#2F4734'];
        const c=cmp[key]||{}; const fmt=m[2]; const col=m[3];
        const dly=c.delta_ly,dse=c.delta_season,dann=c.delta_annual;
        t+=`<tr><td><span class="dot" style="background:${col}"></span>${m[1]}</td>
          <td><b>${fv(c.this,fmt)}</b></td><td>${fv(c.ly,fmt)}</td>
          <td class="${dclass(dly)}">${dly||'—'}</td><td>${fv(c.season_bl,fmt)}</td>
          <td class="${dclass(dse)}">${dse||'—'}</td><td>${fv(c.annual_bl,fmt)}</td>
          <td class="${dclass(dann)}">${dann||'—'}</td></tr>`;});});
    el('sc_table_wrap').innerHTML=t+'</tbody></table>';}

  function renderMini(elid,wk,dkey){
    if(!wk){el(elid).innerHTML='—';return;}
    const cmp=wk.comparisons||{};
    const rows=Object.keys(cmp).map(key=>{
      const c=cmp[key]; const d=c[dkey];
      if(!d||d==='—')return null;
      const mag=Math.abs(parseFloat(d.replace(/[^0-9.-]/g,'')));
      const m=METS.find(x=>x[0]===key);
      return m?{key,lbl:m[1],fmt:m[2],col:m[3],d,mag,this:c.this}:null;
    }).filter(Boolean).sort((a,b)=>b.mag-a.mag).slice(0,8);
    if(!rows.length){el(elid).innerHTML='<span style="color:var(--muted)">No baseline yet</span>';return;}
    el(elid).innerHTML=rows.map(r=>`<div class="metric-row">
      <span><span class="dot" style="background:${r.col}"></span>${r.lbl}</span>
      <span style="display:flex;align-items:center;gap:8px"><span>${fv(r.this,r.fmt)}</span>
        <span class="${dclass(r.d)}" style="font-size:11.5px;min-width:54px;text-align:right">${r.d}</span></span></div>`).join('');}

  const tmet=el('trend_met'), tbl=el('trend_bl');
  tmet.innerHTML=METS.map(m=>`<option value="${m[0]}">${m[1]}</option>`).join('');
  tmet.value=METS[0][0];
  function drawTrend(){
    const key=tmet.value, blkey=tbl.value;
    const m=METS.find(x=>x[0]===key)||METS[0]; const fmt=m[2], col=m[3];
    const W=900,H=240,L=54,R=64,T=14,B=36;
    const weeks=HIST.filter(w=>w[key]!=null).map(w=>({wk:w.week_key,v:w[key],label:w.date_range||w.week_key,n:w.n,season:w.season}));
    if(!weeks.length){el('trend_svg').innerHTML='<text x="450" y="120" text-anchor="middle" font-size="13" fill="#9a9584">No data for this metric yet</text>';return;}
    const vals=weeks.map(w=>w.v); let lo=Math.min(...vals),hi=Math.max(...vals);
    let blv=null;
    if(blkey==='annual'&&BL.annual)blv=BL.annual[key];
    if(blkey==='season'&&BL.by_season){const sv=Object.values(BL.by_season).map(s=>s[key]).filter(v=>v!=null);blv=sv.length?sv.reduce((a,b)=>a+b,0)/sv.length:null;}
    if(blv!=null){lo=Math.min(lo,blv);hi=Math.max(hi,blv);}
    const pad=(hi-lo)*0.14||0.5, ylo=lo-pad, yhi=hi+pad;
    const xi=i=>L+i*(W-L-R)/Math.max(weeks.length-1,1);
    const y=v=>H-B-(v-ylo)/(yhi-ylo)*(H-T-B);
    let g='';
    if(blv!=null){const by=y(blv).toFixed(1);
      g+=`<line x1="${L}" y1="${by}" x2="${W-R}" y2="${by}" stroke="${GOLD}" stroke-width="1.5" stroke-dasharray="5 3" opacity=".8"/>`;
      g+=`<text x="${W-R+4}" y="${+by+3}" font-size="9.5" fill="${GOLD}" font-weight="700">${fv(blv,fmt)}</text>`;}
    for(let i=0;i<=4;i++){const v=ylo+(yhi-ylo)*i/4,yy=y(v).toFixed(1);
      g+=`<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="#e6ddc7"/>`;
      g+=`<text x="${L-5}" y="${+yy+3}" text-anchor="end" font-size="9" fill="${GREY}">${fmt==='$'?'$'+v.toFixed(0):fmt==='n'?v.toFixed(0):v.toFixed(1)+'%'}</text>`;}
    const path=weeks.map((w,i)=>`${i?'L':'M'}${xi(i).toFixed(1)},${y(w.v).toFixed(1)}`).join(' ');
    const ay=y(ylo).toFixed(1);
    g+=`<path d="${path} L${xi(weeks.length-1)},${ay} L${xi(0)},${ay} Z" fill="${col}" opacity=".10"/>`;
    g+=`<path d="${path}" fill="none" stroke="${col}" stroke-width="2"/>`;
    weeks.forEach((w,i)=>{g+=`<circle cx="${xi(i).toFixed(1)}" cy="${y(w.v).toFixed(1)}" r="4" fill="${col}" opacity=".9"/>`;
      if(i%4===0||i===weeks.length-1){const p=w.wk.split('-W');
        g+=`<text x="${xi(i).toFixed(1)}" y="${H-B+14}" text-anchor="middle" font-size="8.5" fill="${GREY}">W${p[1]}'${p[0].slice(2)}</text>`;}});
    const svg=el('trend_svg'); svg.innerHTML=g;
    svg.onmousemove=e=>{const rect=svg.getBoundingClientRect();const px=(e.clientX-rect.left)*W/rect.width;
      const step=(W-L-R)/Math.max(weeks.length-1,1);const i=Math.max(0,Math.min(weeks.length-1,Math.round((px-L)/step)));
      const w=weeks[i];el('trend_tip').innerHTML=`<b>${w.label}</b> · ${m[1]}: <b style="color:${col}">${fv(w.v,fmt)}</b> · ${w.n} checks · ${w.season}`;};}
  tmet.onchange=drawTrend; tbl.onchange=drawTrend; drawTrend();

  const hmet=el('hist_met');
  hmet.innerHTML=METS.map(m=>`<option value="${m[0]}">${m[1]}</option>`).join('');
  hmet.value=METS[0][0];
  function drawGrid(){
    const key=hmet.value; const m=METS.find(x=>x[0]===key)||METS[0]; const fmt=m[2];
    const weeks=HIST.filter(w=>w[key]!=null);
    if(!weeks.length){el('hist_grid').innerHTML='<p style="color:var(--muted)">No history for this metric yet.</p>';return;}
    const vals=weeks.map(w=>w[key]); const lo=Math.min(...vals),hi=Math.max(...vals);
    const byYear={}; weeks.forEach(w=>{const yr=w.week_key.split('-W')[0];(byYear[yr]=byYear[yr]||[]).push(w);});
    let t=`<table class="hist-table" style="width:max-content">`;
    Object.keys(byYear).sort().forEach(yr=>{
      t+=`<tr><td style="font-weight:700;background:var(--alt);white-space:nowrap;padding:5px 10px">${yr}</td>`;
      byYear[yr].forEach(w=>{const v=w[key];const heat=(v-lo)/(hi-lo||1);
        const bg=`rgba(47,71,52,${(0.06+heat*0.72).toFixed(2)})`;const fg=heat>0.55?'#fff':'var(--ink)';
        const wn=w.week_key.split('-W')[1];const act=activeWk&&activeWk.week_key===w.week_key;
        t+=`<td onclick="loadWeek('${w.week_key}')" title="${w.date_range||w.week_key}: ${fv(v,fmt)}"
          style="background:${bg};color:${fg};cursor:pointer;${act?'outline:2px solid var(--gold);outline-offset:-2px':''}">
          <div style="font-size:9px;opacity:.7">W${wn}</div><div style="font-weight:700">${fv(v,fmt)}</div></td>`;});
      t+=`</tr>`;});
    el('hist_grid').innerHTML=t+'</table>';}
  hmet.onchange=drawGrid; drawGrid();

  window.loadWeek=wk_key=>{const wk=HIST.find(w=>w.week_key===wk_key);
    if(wk){activeWk=wk;wsel.value=HIST.indexOf(wk);renderAll(wk);drawGrid();window.scrollTo(0,0);}};
  renderAll(LW);
}
init();
</script>
